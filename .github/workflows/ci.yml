name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 26 ships npm 12 — the same npm that generates package-lock.json
      # locally; npm 10 (Node 20) computes a different peer-dep tree and
      # rejects the lock file on `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
